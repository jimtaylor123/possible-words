name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    if: contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit Groq code review
        uses: actions/github-script@v7
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            // Keep the prompt within the model context window while retaining file names.
            const diff = files
              .map((file) => `--- ${file.filename}\n${file.patch || "Binary file or patch unavailable."}`)
              .join("\n\n")
              .slice(0, 60000);
            const prompt = `Review this pull request for correctness, regressions, security, and missing tests.\n\n` +
              `Return concise Markdown for a GitHub code review. List only actionable findings with file and line references where possible. ` +
              `If there are no findings, say exactly: No actionable findings.\n\nDiff:\n${diff}`;
            let body;
            for (const maxCompletionTokens of [4096, 8192]) {
              const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.GROQ_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  model: process.env.GROQ_MODEL,
                  messages: [{ role: "user", content: prompt }],
                  include_reasoning: false,
                  reasoning_effort: "low",
                  max_completion_tokens: maxCompletionTokens,
                  temperature: 0.5,
                }),
              });
              if (!response.ok) {
                core.setFailed(`Groq review failed: ${response.status} ${await response.text()}`);
                return;
              }

              const result = await response.json();
              body = result.choices?.[0]?.message?.content?.trim();
              if (body) break;
            }
            if (!body) {
              core.setFailed("Groq returned no review content after retrying with a larger output budget.");
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pullNumber,
              commit_id: context.payload.pull_request.head.sha,
              event: "COMMENT",
              body: `## Groq code review\n\n${body}`,
            });
