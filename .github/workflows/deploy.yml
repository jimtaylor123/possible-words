name: Deploy to production (Lambda)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVERLESS_VERSION: 3.40.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
      APP_KEY: ${{ secrets.APP_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      MERRIAM_WEBSTER_API_KEY: ${{ secrets.MERRIAM_WEBSTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
      PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
      PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET }}
      PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        env:
          VITE_PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
        run: npm run build

      - name: Package and verify the banned-words gate
        run: |
          set -euo pipefail
          rm -rf /tmp/sls-package && mkdir -p /tmp/sls-package
          npx serverless@$SERVERLESS_VERSION package --package /tmp/sls-package
          unzip -l /tmp/sls-package/possiblewords.zip \
            | grep -q 'storage/app/dictionary/banned-words.json' \
            || { echo '::error::storage/app/dictionary/banned-words.json is missing from the deployment package'; exit 1; }

      - name: Deploy with Serverless
        run: npx serverless@$SERVERLESS_VERSION deploy --package /tmp/sls-package

      - name: Run production migrations
        run: npx serverless@$SERVERLESS_VERSION invoke -f artisan --data '{"cli":"migrate --force"}'

      - name: Smoke-test API endpoint (blocking)
        run: |
          endpoint=$(aws apigatewayv2 get-apis --region "$AWS_DEFAULT_REGION" \
            --query "Items[?contains(Name, \`possiblewords\`)].ApiEndpoint | [0]" \
            --output text)
          [ -n "$endpoint" ] && [ "$endpoint" != "None" ] || { echo "API endpoint not found"; exit 1; }
          ok=""
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$endpoint/")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = 200 ] || [ "$code" = 302 ] || [ "$code" = 401 ] || [ "$code" = 403 ]; then
              ok=1
              break
            fi
            sleep 10
          done
          [ -n "$ok" ] || exit 1

      - name: Public domain check (non-blocking)
        run: |
          set +e
          public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://possiblewords.jimtaylor.space/ 2>/dev/null)
          set -e
          echo "Public domain (custom DNS) status: ${public:-unreachable - check DNS}"
