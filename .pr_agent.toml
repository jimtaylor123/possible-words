[config]
model = "groq/openai/gpt-oss-120b"
fallback_models = ["gemini/gemini-3.8-flash"]
retry_with_fallback = true
ai_timeout = 90
custom_model_max_tokens = 4096
# Inlining the linked issue blows the prompt budget on long issue bodies and
# kills the review with "Related-ticket omission marker exceeds the prompt token
# budget" before the model is ever called. Diff review is what we actually need.
extract_issue_from_branch = false

[pr_reviewer]
require_ticket_analysis_review = false

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = false
pr_actions = ["opened", "reopened", "ready_for_review"]