service: possiblewords

provider:
    name: aws
    region: eu-west-1
    stage: prod
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - s3:GetObject
                      - s3:PutObject
                      - s3:DeleteObject
                  Resource: arn:aws:s3:::possiblewords-prod-audio/audio/*
                - Effect: Allow
                  Action:
                      - s3:ListBucket
                  Resource: arn:aws:s3:::possiblewords-prod-audio
    environment:
        APP_ENV: production
        APP_KEY: ${env:APP_KEY}
        APP_DEBUG: 0
        APP_NAME: "Possible Words"
        APP_URL: https://possiblewords.jimtaylor.space
        LOG_CHANNEL: stderr
        LOG_STDERR_FORMATTER: Bref\Monolog\CloudWatchFormatter
        SESSION_DRIVER: cookie

        SCOUT_DRIVER: database

        # Fail loudly in the nightly generate job if the banned-words file is
        # missing from the package, instead of silently accepting every word.
        BANNED_WORDS_REQUIRED: 'true'

        # Merriam-Webster is the authoritative production dictionary source.
        # dictionaryapi.dev times out from the Lambda environment.
        FREE_DICTIONARY_ENABLED: 'false'
        MERRIAM_WEBSTER_ENABLED: 'true'
        MERRIAM_WEBSTER_API_KEY: ${env:MERRIAM_WEBSTER_API_KEY}
        GEMINI_API_KEY: ${env:GEMINI_API_KEY}

        # Keep the scheduled RDAP batch's per-word worst case fixed: three
        # ten-second attempts, 1.2 seconds of retry backoff, and a 4/s throttle.
        DOMAIN_TIMEOUT: '10'
        DOMAIN_ATTEMPTS: '3'
        DOMAIN_RETRY_SLEEP_MS: '400'
        DOMAIN_THROTTLE: '4'
        # Database-backed lease shared by all Lambda invocations. It matches
        # the Lambda ceiling so a timed-out invocation cannot overlap a retry.
        DOMAIN_RUN_LOCK_TTL_SECONDS: '720'

        WORD_RELEASE_BATCH_SIZE: ${env:WORD_RELEASE_BATCH_SIZE, '10'}
        WORD_RELEASE_SCHEDULE: ${env:WORD_RELEASE_SCHEDULE, 'cron(0 */6 * * ? *)'}

        DB_CONNECTION: turso
        TURSO_DATABASE_URL: ${env:TURSO_DATABASE_URL}
        TURSO_AUTH_TOKEN: ${env:TURSO_AUTH_TOKEN}
        TURSO_CONNECT_TIMEOUT: ${env:TURSO_CONNECT_TIMEOUT, '5'}
        TURSO_REQUEST_TIMEOUT: ${env:TURSO_REQUEST_TIMEOUT, '15'}

        BROADCAST_CONNECTION: pusher
        PUSHER_APP_ID: ${env:PUSHER_APP_ID}
        PUSHER_APP_KEY: ${env:PUSHER_APP_KEY}
        PUSHER_APP_SECRET: ${env:PUSHER_APP_SECRET}
        PUSHER_APP_CLUSTER: ${env:PUSHER_APP_CLUSTER}
        PUSHER_PORT: 443
        PUSHER_SCHEME: https

        QUEUE_CONNECTION: sync
        CACHE_STORE: array

        FILESYSTEM_DISK: s3
        AWS_BUCKET: possiblewords-prod-audio
        AWS_ENDPOINT: ${env:AWS_ENDPOINT, ''}
        AWS_USE_PATH_STYLE_ENDPOINT: false

        TTS_PROVIDER: edge-tts

        GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
        GOOGLE_REDIRECT_URI: https://possiblewords.jimtaylor.space/auth/google/callback

        VITE_PUSHER_APP_KEY: ${env:PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${env:PUSHER_APP_CLUSTER}

functions:
    web:
        handler: public/index.php
        runtime: php-84-fpm
        timeout: 28
        events:
            - httpApi: '*'

    artisan:
        handler: artisan
        runtime: php-84-console
        timeout: 720
        events:
            - schedule:
                  rate: cron(0 5 * * ? *)
                  input:
                      cli: 'words:generate --count=20'
            - schedule:
                  rate: cron(30 5 * * ? *)
                  input:
                      cli: 'words:generate-pronunciation --chunk=50'
            - schedule:
                  rate: cron(0 6 * * ? *)
                  input:
                      cli: 'words:check-dictionary --chunk=50 --retry-failed'
            # Each invocation is capped at 8 RDAP attempts. Worst case is 596.6 s:
            # 8 * (3 * 10 + 1.2 retry sleeps + 0.25 throttle + 15 Turso
            # write) = 371.6 s, plus 90 s for insert-or-ignore + conditional
            # expired-lease replacement + count + full-page and terminating
            # chunkById selects + release DB requests,
            # 15 s startup/logging, and 120 s margin. It is below
            # both the 660-second cadence and the 720-second Lambda timeout.
            # The database lease prevents overlapping retries from duplicating
            # a word or collectively exceeding the 4 r/s RDAP throttle.
            - schedule:
                  rate: rate(11 minutes)
                  input:
                      cli: 'words:check-domains --chunk=8 --limit=8'
            - schedule:
                  rate: ${env:WORD_RELEASE_SCHEDULE, 'cron(0 */6 * * ? *)'}
                  input:
                      cli: 'words:release'

package:
    patterns:
        - '!.env'
        - '!node_modules/**'
        - '!public/storage'
        - '!resources/assets/**'
        - '!resources/css/**'
        - '!resources/images/**'
        - '!resources/js/**'
        - '!storage/**'
        # storage/** is excluded above, but the generation gate needs this file at
        # runtime. Serverless applies the package.patterns list in order
        # (lib/plugins/package/lib/package-service.js pushes every include after
        # the excludes and filters with micromatch in that order), so the
        # re-inclusion below wins. Bref mounts the app at /var/task, so the file
        # resolves at /var/task/storage/app/dictionary/banned-words.json.
        - 'storage/app/dictionary/banned-words.json'
        - '!tests/**'
        - '!database/*.sqlite'
        - '!public/build/**'
        - 'public/build/manifest.json'
        - 'public/build/assets/**'
        - '!vendor/aws/aws-sdk-php/src/data/**'
        - 'vendor/aws/aws-sdk-php/src/data/manifest.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/endpoints.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/partitions.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/grandfathered-services.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/sdk-default-configuration.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/endpoints_prefix_history.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/aliases.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/s3/**'
        - '!docker-compose.yml'

plugins:
    - ./vendor/bref/bref
