service: possiblewords

provider:
    name: aws
    region: eu-west-1
    stage: prod
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - s3:GetObject
                      - s3:PutObject
                      - s3:DeleteObject
                  Resource: arn:aws:s3:::possiblewords-prod-audio/audio/*
                - Effect: Allow
                  Action:
                      - s3:ListBucket
                  Resource: arn:aws:s3:::possiblewords-prod-audio
    environment:
        APP_ENV: production
        APP_DEBUG: 0
        APP_NAME: "Possible Words"
        APP_URL: https://possiblewords.jimtaylor.space
        LOG_CHANNEL: stderr
        LOG_STDERR_FORMATTER: Bref\Monolog\CloudWatchFormatter
        SESSION_DRIVER: cookie

        SCOUT_DRIVER: database

        # Fail loudly in the nightly generate job if the banned-words file is
        # missing from the package, instead of silently accepting every word.
        BANNED_WORDS_REQUIRED: 'true'

        # Merriam-Webster is the authoritative production dictionary source.
        # dictionaryapi.dev times out from the Lambda environment.
        FREE_DICTIONARY_ENABLED: 'false'
        MERRIAM_WEBSTER_ENABLED: 'true'

        # A request is deferred after every unknown outcome; no invocation loops
        # retries. Keep per-request pacing and Retry-After cooldowns conservative
        # and bounded so the 8-request scheduled batch fits the Lambda ceiling.
        DOMAIN_TIMEOUT: '10'
        DOMAIN_REQUEST_INTERVAL_MS: '1000'
        DOMAIN_REQUEST_JITTER_MS: '100'
        DOMAIN_RETRY_BASE_SECONDS: '60'
        DOMAIN_RETRY_CAP_SECONDS: '3600'
        DOMAIN_RETRY_JITTER_SECONDS: '15'
        DOMAIN_MAX_RETRY_AFTER_SECONDS: '600'
        # Stop rather than sleeping through the next 11-minute event. Reserve
        # enough time for one final ten-second lookup and Turso persistence.
        DOMAIN_RUN_MAX_SECONDS: '600'
        DOMAIN_RUN_DEADLINE_RESERVE_SECONDS: '30'
        # Database-backed lease shared by all Lambda invocations. It matches
        # the Lambda ceiling so a timed-out invocation cannot overlap a retry.
        DOMAIN_RUN_LOCK_TTL_SECONDS: '720'

        WORD_RELEASE_BATCH_SIZE: ${env:WORD_RELEASE_BATCH_SIZE, '10'}
        WORD_RELEASE_SCHEDULE: ${env:WORD_RELEASE_SCHEDULE, 'cron(0 */6 * * ? *)'}

        DB_CONNECTION: turso
        TURSO_CONNECT_TIMEOUT: ${env:TURSO_CONNECT_TIMEOUT, '5'}
        TURSO_REQUEST_TIMEOUT: ${env:TURSO_REQUEST_TIMEOUT, '15'}

        BROADCAST_CONNECTION: pusher
        PUSHER_PORT: 443
        PUSHER_SCHEME: https

        QUEUE_CONNECTION: sync
        CACHE_STORE: array
        MAIL_MAILER: smtp
        MAIL_SCHEME: smtps
        MAIL_HOST: smtp.resend.com
        MAIL_PORT: 465
        MAIL_USERNAME: resend
        MAIL_FROM_ADDRESS: notifications@possiblewords.jimtaylor.space

        FILESYSTEM_DISK: s3
        AWS_BUCKET: possiblewords-prod-audio
        AWS_ENDPOINT: ${env:AWS_ENDPOINT, ''}
        AWS_USE_PATH_STYLE_ENDPOINT: false

        TTS_PROVIDER: edge-tts

        GOOGLE_REDIRECT_URI: https://possiblewords.jimtaylor.space/auth/google/callback

custom:
    # Keep the default retention small; deployments can override it with
    # BACKUP_RETENTION_DAYS without changing the infrastructure definition.
    backupRetentionDays: ${env:BACKUP_RETENTION_DAYS, 7}
    # Do not place these in provider.environment: Serverless merges that map
    # into every function, including the deliberately isolated backup Lambda.
    applicationEnvironment:
        APP_KEY: ${env:APP_KEY}
        MERRIAM_WEBSTER_API_KEY: ${env:MERRIAM_WEBSTER_API_KEY}
        GEMINI_API_KEY: ${env:GEMINI_API_KEY}
        TURSO_DATABASE_URL: ${env:TURSO_DATABASE_URL}
        TURSO_AUTH_TOKEN: ${env:TURSO_AUTH_TOKEN}
        PUSHER_APP_ID: ${env:PUSHER_APP_ID}
        PUSHER_APP_KEY: ${env:PUSHER_APP_KEY}
        PUSHER_APP_SECRET: ${env:PUSHER_APP_SECRET}
        PUSHER_APP_CLUSTER: ${env:PUSHER_APP_CLUSTER}
        MAIL_PASSWORD: ${env:RESEND_SMTP_PASSWORD}
        GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
        VITE_PUSHER_APP_KEY: ${env:PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${env:PUSHER_APP_CLUSTER}

functions:
    web:
        handler: public/index.php
        runtime: php-84-fpm
        timeout: 28
        environment: ${self:custom.applicationEnvironment}
        events:
            - httpApi: '*'

    artisan:
        handler: artisan
        runtime: php-84-console
        timeout: 720
        environment: ${self:custom.applicationEnvironment}
        events:
            - schedule:
                  rate: cron(0 5 * * ? *)
                  input:
                      cli: 'words:generate --count=20'
            - schedule:
                  rate: cron(30 5 * * ? *)
                  input:
                      cli: 'words:generate-pronunciation --chunk=50'
            - schedule:
                  rate: cron(0 6 * * ? *)
                  input:
                      cli: 'words:check-dictionary --chunk=50 --retry-failed'
            # Each invocation is capped at 8 single RDAP attempts. Its normal
            # worst case is 8 * (10-second timeout + 1.1-second pacing +
            # 15-second Turso write), plus database/startup margin. A provider
            # cooldown that would exceed the 600-second command deadline stops
            # the batch so its lease is released before the next event.
            - schedule:
                  rate: rate(11 minutes)
                  input:
                      cli: 'words:check-domains --chunk=8 --limit=8'
            - schedule:
                  rate: ${env:WORD_RELEASE_SCHEDULE, 'cron(0 */6 * * ? *)'}
                  input:
                      cli: 'words:release'
            - schedule:
                  rate: cron(0 8 * * ? *)
                  input:
                      cli: 'notifications:send-digests'
            - schedule:
                  rate: rate(5 minutes)
                  input:
                      cli: 'notifications:retry-immediate'
            - schedule:
                  rate: cron(30 8 * * ? *)
                  input:
                      cli: 'notifications:prune'

    backup:
        handler: artisan
        runtime: php-84-console
        timeout: 720
        role:
            Fn::GetAtt:
                - BackupLambdaRole
                - Arn
        environment:
            # Laravel registers broadcast channels while booting Artisan. The
            # isolated backup Lambda deliberately has no Pusher credentials.
            BROADCAST_CONNECTION: log
            BACKUP_SOURCE_DISK: s3
            BACKUP_DESTINATION_DISK: backups
            BACKUP_BUCKET:
                Ref: BackupBucket
            BACKUP_PREFIX: runs
            TURSO_ORGANIZATION: ${env:TURSO_ORGANIZATION}
            TURSO_PRODUCTION_DATABASE: ${env:TURSO_PRODUCTION_DATABASE}
            TURSO_BACKUP_API_TOKEN: ${env:TURSO_BACKUP_API_TOKEN}
            TURSO_CLI_PATH: /var/task/bin/turso
        events:
            - schedule:
                  rate: cron(0 */3 * * ? *)
                  input:
                      cli: 'backup:run'
            - schedule:
                  rate: cron(0 * * * ? *)
                  input:
                      cli: 'backup:check-freshness'

resources:
    Resources:
        BackupBucket:
            Type: AWS::S3::Bucket
            Properties:
                BucketName: possiblewords-${sls:stage}-${aws:accountId}-backups
                BucketEncryption:
                    ServerSideEncryptionConfiguration:
                        - ServerSideEncryptionByDefault:
                              SSEAlgorithm: AES256
                OwnershipControls:
                    Rules:
                        - ObjectOwnership: BucketOwnerEnforced
                PublicAccessBlockConfiguration:
                    BlockPublicAcls: true
                    BlockPublicPolicy: true
                    IgnorePublicAcls: true
                    RestrictPublicBuckets: true
                VersioningConfiguration:
                    Status: Enabled
                LifecycleConfiguration:
                    Rules:
                        - Id: ExpireBackupRunData
                          Status: Enabled
                          ExpirationInDays: ${self:custom.backupRetentionDays}
                          NoncurrentVersionExpiration:
                              NoncurrentDays: 1
                        - Id: DeleteExpiredBackupDeleteMarkers
                          Status: Enabled
                          ExpiredObjectDeleteMarker: true
        BackupAlarmTopic:
            Type: AWS::SNS::Topic
            Properties:
                TopicName: possiblewords-${sls:stage}-backup-alarms
                Subscription:
                    - Endpoint: jimtayloremail@gmail.com
                      Protocol: email
        BackupLambdaRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action: sts:AssumeRole
                ManagedPolicyArns:
                    - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                Policies:
                    - PolicyName: BackupDataAccess
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              # The source disk includes `audio/`, root-level
                              # application objects, and future uploads. This
                              # dedicated role is read-only and backs up that
                              # complete disk; see docs/backups.md.
                              - Effect: Allow
                                Action:
                                    - s3:ListBucket
                                Resource:
                                    - arn:aws:s3:::possiblewords-prod-audio
                              - Effect: Allow
                                Action: s3:GetObject
                                Resource: arn:aws:s3:::possiblewords-prod-audio/*
                              - Effect: Allow
                                Action:
                                    - s3:GetObject
                                    - s3:PutObject
                                    - s3:DeleteObject
                                Resource:
                                    Fn::Join:
                                        - ''
                                        - - Fn::GetAtt: [BackupBucket, Arn]
                                          - '/*'
                              - Effect: Allow
                                Action: s3:ListBucket
                                Resource:
                                    Fn::GetAtt: [BackupBucket, Arn]
                              - Effect: Allow
                                Action: cloudwatch:PutMetricData
                                Resource: '*'
                                Condition:
                                    StringEquals:
                                        cloudwatch:namespace: PossibleWords/Backups
        BackupLambdaErrorsAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
                AlarmDescription: The backup Lambda invocation failed.
                Namespace: AWS/Lambda
                MetricName: Errors
                Statistic: Sum
                Period: 300
                EvaluationPeriods: 1
                Threshold: 1
                ComparisonOperator: GreaterThanOrEqualToThreshold
                TreatMissingData: notBreaching
                Dimensions:
                    - Name: FunctionName
                      Value:
                          Ref: BackupLambdaFunction
                AlarmActions:
                    - Ref: BackupAlarmTopic
        BackupFreshnessAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
                AlarmDescription: No verified backup manifest is younger than four hours.
                Namespace: PossibleWords/Backups
                MetricName: BackupFreshness
                Statistic: Minimum
                Period: 3600
                EvaluationPeriods: 1
                Threshold: 1
                ComparisonOperator: LessThanThreshold
                TreatMissingData: breaching
                AlarmActions:
                    - Ref: BackupAlarmTopic

package:
    patterns:
        - '!.env'
        - '!node_modules/**'
        - '!public/storage'
        - '!resources/assets/**'
        - '!resources/css/**'
        - '!resources/images/**'
        - '!resources/js/**'
        - '!storage/**'
        # storage/** is excluded above, but the generation gate needs this file at
        # runtime. Serverless applies the package.patterns list in order
        # (lib/plugins/package/lib/package-service.js pushes every include after
        # the excludes and filters with micromatch in that order), so the
        # re-inclusion below wins. Bref mounts the app at /var/task, so the file
        # resolves at /var/task/storage/app/dictionary/banned-words.json.
        - 'storage/app/dictionary/banned-words.json'
        - '!tests/**'
        - '!database/*.sqlite'
        - '!public/build/**'
        - 'public/build/manifest.json'
        - 'public/build/assets/**'
        - '!vendor/aws/aws-sdk-php/src/data/**'
        - 'vendor/aws/aws-sdk-php/src/data/manifest.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/endpoints.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/partitions.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/grandfathered-services.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/sdk-default-configuration.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/endpoints_prefix_history.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/aliases.json.php'
        - 'vendor/aws/aws-sdk-php/src/data/s3/**'
        - 'vendor/aws/aws-sdk-php/src/data/cloudwatch/**'
        - 'vendor/aws/aws-sdk-php/src/data/monitoring/**'
        - 'bin/turso'
        - 'bin/sqlite3'
        - '!docker-compose.yml'

plugins:
    - ./vendor/bref/bref
